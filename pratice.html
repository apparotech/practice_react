<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Card</title>

    <!-- Tailwind CSS -->
   <link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

    <!-- Page Container -->
    <div class="min-h-screen flex items-center justify-center p-6">

        <!-- Product Card -->
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-lg overflow-hidden">

            <!-- Product Image -->
            <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
                alt="Running Shoes"
                class="w-full h-64 object-cover"
            >

            <!-- Product Information -->
            <div class="p-6">

                <!-- Category -->
                <p class="text-sm text-gray-500">
                    Sports Shoes
                </p>

                <!-- Product Name -->
                <h1 class="text-2xl font-bold text-gray-800 mt-2">
                    Running Shoes
                </h1>

                <!-- Rating -->
                <div class="flex items-center gap-2 mt-3">

                    <span class="text-yellow-500">
                        ★★★★★
                    </span>

                    <span class="text-gray-500 text-sm">
                        4.8 (120 reviews)
                    </span>

                </div>

                <!-- Description -->
                <p class="text-gray-600 mt-4">
                    Comfortable and lightweight running shoes
                    designed for everyday running and exercise.
                </p>

                <!-- Price -->
                <div class="flex items-center gap-3 mt-5">

                    <span class="text-3xl font-bold text-gray-900">
                        ₹2,999
                    </span>

                    <span class="text-gray-400 line-through">
                        ₹4,999
                    </span>

                </div>

                <!-- Buttons -->
                <div class="flex gap-3 mt-6">

                    <button
                        class="flex-1 bg-black text-white py-3 rounded-lg font-semibold hover:bg-gray-800"
                    >
                        Buy Now
                    </button>

                    <button
                        class="flex-1 border border-gray-300 py-3 rounded-lg font-semibold hover:bg-gray-100"
                    >
                        Add Cart
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
