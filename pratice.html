<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>
   <!-- Tailwind CSS -->
   
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Main Container -->
    <div class="min-h-screen flex items-center justify-center p-6">

        <!-- Card -->
        <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8">

            <!-- Profile -->
            <div class="text-center">

                <img
                    src="https://via.placeholder.com/120"
                    alt="Profile"
                    class="w-28 h-28 rounded-full mx-auto object-cover"
                >

                <h1 class="text-3xl font-bold text-gray-800 mt-4">
                    Raj Kumar Mahto
                </h1>

                <p class="text-gray-500 mt-2">
                    Flutter Developer
                </p>

            </div>

            <!-- About -->
            <div class="mt-6">

                <h2 class="text-xl font-semibold text-gray-800">
                    About Me
                </h2>

                <p class="text-gray-600 mt-2 leading-relaxed">
                    I am a software developer interested in Flutter,
                    Web Development, Node.js and AI/ML.
                </p>

            </div>

            <!-- Skills -->
            <div class="mt-6">

                <h2 class="text-xl font-semibold text-gray-800">
                    Skills
                </h2>

                <div class="flex flex-wrap gap-2 mt-3">

                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full">
                        Flutter
                    </span>

                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full">
                        HTML
                    </span>

                    <span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full">
                        JavaScript
                    </span>

                    <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full">
                        Node.js
                    </span>

                </div>

            </div>

            <!-- Buttons -->
            <div class="flex gap-3 mt-8">

                <a
                    href="#"
                    class="flex-1 text-center bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700"
                >
                    GitHub
                </a>

                <a
                    href="#"
                    class="flex-1 text-center border border-gray-300 py-3 rounded-lg hover:bg-gray-100"
                >
                    Contact
                </a>

            </div>

        </div>

    </div>

</body>
</html>
