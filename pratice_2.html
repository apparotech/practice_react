<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tailwind Practice</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-gray-100">

    <!-- Main Container -->
    <div class="min-h-screen flex items-center justify-center p-6">

        <!-- Dashboard Card -->
        <div class="w-full max-w-md bg-white rounded-2xl shadow-md p-6">

            <!-- User Header -->
            <div class="flex items-center justify-between">

                <div class="flex items-center gap-4">

                    <!-- Avatar -->
                    <div class="w-14 h-14 bg-blue-500 rounded-full flex items-center justify-center">

                        <span class="text-white text-lg font-bold">
                            AK
                        </span>

                    </div>

                    <!-- User Info -->
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">
                            Aditya Kumar
                        </h1>

                        <p class="text-sm text-gray-500">
                            Software Developer
                        </p>
                    </div>

                </div>

                <!-- Status -->
                <span class="px-3 py-1 bg-green-100 text-green-600 rounded-full text-sm">
                    Online
                </span>

            </div>

            <!-- Divider -->
            <div class="border-t border-gray-200 my-6"></div>

            <!-- Statistics -->
            <div class="flex justify-between text-center">

                <div>
                    <h2 class="text-2xl font-bold text-gray-900">
                        24
                    </h2>

                    <p class="text-sm text-gray-500">
                        Projects
                    </p>
                </div>

                <div>
                    <h2 class="text-2xl font-bold text-gray-900">
                        1.2K
                    </h2>

                    <p class="text-sm text-gray-500">
                        Followers
                    </p>
                </div>

                <div>
                    <h2 class="text-2xl font-bold text-gray-900">
                        86
                    </h2>

                    <p class="text-sm text-gray-500">
                        Following
                    </p>
                </div>

            </div>

            <!-- Button -->
            <button
                class="mt-6 w-full bg-blue-600 text-white py-3 rounded-xl font-medium"
            >
                View Profile
            </button>

        </div>

    </div>

</body>
</html>
